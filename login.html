<!DOCTYPE html>
<html lang="en">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Roland Holidays</title>
    <!-- Theme CSS -->
    <link rel="stylesheet" type="text/css" href="./assets/style/bootstrap.css">
    <link rel="stylesheet" type="text/css" href="./assets/style/color5.css">
    <!-- Design System CSS -->
    <link rel="stylesheet" type="text/css" href="./assets/style/design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css" />
    <style>
        .login-page {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('./assets/img/home.jpg');
            background-size: cover;
            background-position: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            backdrop-filter: blur(10px);
        }
        .login-header { text-align: center; margin-bottom: 30px; }
        .logo-wrapper { 
            background: linear-gradient(135deg, #16345e 0%, #0a1b35 100%);
            padding: 15px;
            border-radius: 18px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .login-header img { max-width: 170px; display: block; }
        .form-group { margin-bottom: 20px; }
        .btn-login { 
            width: 100%; 
            padding: 13px; 
            font-size: 17px; 
            background: linear-gradient(135deg, #1f6fe5 0%, #0f5ccc 100%);
            border: none; 
            border-radius: 50px;
            color: white;
            font-weight: 700;
            transition: 0.3s;
            box-shadow: 0 8px 16px rgba(31, 111, 229, 0.2);
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(31, 111, 229, 0.3); }
        .error-msg { color: #e53e3e; text-align: center; margin-bottom: 15px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-wrapper">
                    <img src="./assets/img/logo.png" alt="Roland Holidays Logo">
                </div>
                <h3 class="mb-0">Admin Portal</h3>
                <p class="text-muted">Enter credentials to access editor</p>
            </div>
            <div id="errorMessage" class="error-msg">Invalid Credentials!</div>
            <form id="loginForm">
                <div class="ds-form-group">
                    <label class="ds-label">Email Address</label>
                    <input type="email" id="email" class="ds-input" placeholder="admin123@gmail.com" required>
                </div>
                <div class="ds-form-group">
                    <label class="ds-label">Password</label>
                    <input type="password" id="password" class="ds-input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="primary-button w-100 mt-2">
                    <div class="button-item-main">
                        <div class="button-text-pill">
                            <div class="primay-button-text">Login to Admin Portal</div>
                            <div class="primay-button-text">Login to Admin Portal</div>
                        </div>
                        <div class="button-arrow-pill">
                            <div class="arrow-wrapper">
                                <i class="fas fa-lock button-arrow"></i>
                            </div>
                        </div>
                    </div>
                </button>
            </form>
            <div class="mt-4 text-center">
                <a href="index.html" class="text-muted"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const error = document.getElementById('errorMessage');

            if (email === 'admin123@gmail.com' && password === 'Admin@123') {
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'index.html';
            } else {
                error.style.display = 'block';
                setTimeout(() => { error.style.display = 'none'; }, 3000);
            }
        };
    </script>
    <!-- Design System JS Engine -->
    <script src="./assets/js/design-system.js"></script>
</body>
</html>
